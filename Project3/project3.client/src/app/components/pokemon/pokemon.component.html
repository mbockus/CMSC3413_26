<div class="container-fluid py-5 bg-light">
  <button class="btn btn-secondary mb-3" (click)="goBack()">
    ← Back to Pokédex
  </button>

  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!isLoading && pokemon" class="bg-white p-5 rounded shadow">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-capitalize mb-0">{{ pokemon.name }}</h2>
      <div>
        <button *ngIf="!isEditing" class="btn btn-primary me-2" (click)="toggleEdit()">
          <i class="bi bi-pencil"></i> Edit
        </button>
        <button class="btn btn-danger" (click)="deletePokemon()">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </div>

    <!-- View Mode -->
    <div *ngIf="!isEditing">
      <div class="row">
        <div class="col-md-6">
          <p><strong>Types:</strong> 
            <span *ngFor="let type of pokemon.types" class="badge bg-primary me-1">{{ type.name }}</span>
          </p>
        </div>
        <div class="col-md-6">
          <p><strong>Level:</strong> {{ pokemon.level }}</p>
        </div>
        <div class="col-md-6">
          <p><strong>HP:</strong> {{ pokemon.hp }}</p>
        </div>
      </div>
    </div>

    <!-- Edit Mode -->
    <div *ngIf="isEditing">
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" [(ngModel)]="editForm.name" name="name" required>
        </div>
        <div class="mb-3">
          <label for="type" class="form-label">Types</label>
          <div class="input-group">
            <input 
              type="text" 
              class="form-control" 
              id="type" 
              [(ngModel)]="currentType"
              [ngModelOptions]="{standalone: true}"
              placeholder="e.g., Fire, Water, Grass"
              (keyup.enter)="addType()">
            <button 
              type="button" 
              class="btn btn-primary" 
              (click)="addType()"
              [disabled]="!currentType.trim()">
              <i class="bi bi-plus"></i> Add
            </button>
          </div>
          <div *ngIf="editForm.types.length > 0" class="mt-2">
            <span *ngFor="let type of editForm.types; let i = index" class="badge bg-primary me-2 mb-2" style="font-size: 0.9rem;">
              {{ type.name }}
              <i class="bi bi-x-circle ms-1" style="cursor: pointer;" (click)="removeType(i)"></i>
            </span>
          </div>
        </div>
        <div class="mb-3">
          <label for="level" class="form-label">Level</label>
          <input type="number" class="form-control" id="level" [(ngModel)]="editForm.level" name="level" min="1" max="100" required>
        </div>
        <div class="mb-3">
          <label for="hp" class="form-label">HP</label>
          <input type="number" class="form-control" id="hp" [(ngModel)]="editForm.hp" name="hp" min="1" required>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-success" (click)="savePokemon()" [disabled]="editForm.types.length === 0">
            <i class="bi bi-check-circle"></i> Save
          </button>
          <button type="button" class="btn btn-secondary" (click)="toggleEdit()">
            <i class="bi bi-x-circle"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="!isLoading && !pokemon" class="alert alert-danger mt-4">
    Pokémon not found.
  </div>
</div>
