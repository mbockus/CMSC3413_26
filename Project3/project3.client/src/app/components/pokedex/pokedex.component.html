<div class="container-fluid py-5 bg-light">
    <h1 class="text-center mb-5">Pokédex</h1>

    <div *ngIf="isLoading" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!isLoading">
        <!-- Grid of Pokemon -->
        <div class="row g-4 mb-4">
            <div *ngFor="let pokemon of pokemonList" class="col-lg-3 col-md-4 col-sm-6"
                [appPokemonTypeColor]="pokemon.type">
                <div class="card h-100 shadow-sm">

                    <div class="card-body">
                        <h5 class="card-title text-capitalize">{{ pokemon.name }}</h5>
                        <p class="card-text">
                            <small class="text-muted">
                                <strong>Type:</strong>
                                <span class="badge bg-primary me-2">
                                    {{ pokemon.type }}
                                </span>
                            </small>
                        </p>
                        <p class="card-text">
                            <small class="text-muted">
                                <strong>HP:</strong> {{ pokemon.hp }}<br>
                                <strong>Level:</strong> {{ pokemon.level }}
                            </small>
                        </p>
                        <button class="btn btn-sm btn-primary" [routerLink]="['/pokemon', pokemon.id]">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
