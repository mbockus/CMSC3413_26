<div class="container-fluid py-5 bg-light">
    <h1 class="text-center mb-5">Pokédex</h1>

    <div *ngIf="isLoading" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!isLoading">
        <!-- Grid of Pokemon -->
        <div class="row g-4 mb-4">
            <div *ngFor="let pokemon of pokemonList" class="col-lg-3 col-md-4 col-sm-6"
                [appPokemonTypeColor]="pokemon.types[0].type.name">
                <div class="card h-100 shadow-sm">
                    <div class="bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
                        <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name"
                            style="max-width: 100%; max-height: 100%; object-fit: contain;">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title text-capitalize">{{ pokemon.name }}</h5>
                        <p class="card-text">
                            <small class="text-muted">
                                <strong>Type:</strong>
                                <span *ngFor="let type of pokemon.types" class="badge bg-primary me-2">
                                    {{ type.type.name }}
                                </span>
                            </small>
                        </p>
                        <p class="card-text">
                            <small class="text-muted">
                                <strong>Height:</strong> {{ (pokemon.height / 10).toFixed(1) }}m<br>
                                <strong>Weight:</strong> {{ (pokemon.weight / 10).toFixed(1) }}kg
                            </small>
                        </p>
                        <button class="btn btn-sm btn-primary" [routerLink]="['/pokemon', pokemon.name]">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination Controls -->
        <div class="d-flex justify-content-center mt-5">
            <ngb-pagination [collectionSize]="totalCount" [pageSize]="pageSize" [page]="currentPage"
                (pageChange)="onPageChange($event)" [maxSize]="5" [boundaryLinks]="true" [directionLinks]="true">
            </ngb-pagination>
        </div>
    </div>
</div>
