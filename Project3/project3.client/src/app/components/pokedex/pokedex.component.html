<div class="container-fluid py-5 bg-light">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Pokédex</h1>
        <button class="btn btn-success" (click)="goToCreate()">
            <i class="bi bi-plus-circle"></i> Add New Pokemon
        </button>
    </div>

    <div *ngIf="isLoading" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!isLoading && pokemonList.length === 0" class="text-center">
        <p class="text-muted">No Pokemon found. Create your first one!</p>
    </div>

    <div *ngIf="!isLoading && pokemonList.length > 0">
        <!-- Grid of Pokemon -->
        <div class="row g-4">
            <div *ngFor="let pokemon of pokemonList" class="col-lg-3 col-md-4 col-sm-6">
                <div class="card h-100 shadow-sm" (click)="viewPokemon(pokemon.id)" style="cursor: pointer;">
                    <div class="card-body">
                        <h5 class="card-title text-capitalize">{{ pokemon.name }}</h5>
                        <div class="mb-2">
                            <span class="badge bg-primary">{{ pokemon.type }}</span>
                        </div>
                        <p class="card-text">
                            <small class="text-muted">
                                <strong>Level:</strong> {{ pokemon.level }}<br>
                                <strong>HP:</strong> {{ pokemon.hp }}
                            </small>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
