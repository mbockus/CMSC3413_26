<div class="min-vh-100">
  <header class="bg-white shadow-sm mb-4" *ngIf="authState.isAuthenticated">
    <div class="container py-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h1 class="h3 fw-bold text-dark mb-0">{{ title }}</h1>
        </div>

        <div *ngIf="authState.user" class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" 
                 style="width: 32px; height: 32px; font-size: 14px; font-weight: bold;">
              {{ authState.user.username.charAt(0).toUpperCase() }}
            </div>
            <span class="text-dark">{{ authState.user.username }}</span>
          </div>
          <button (click)="logout()" class="btn btn-outline-secondary btn-sm">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    <router-outlet></router-outlet>
  </main>

  <app-toasts aria-live="polite" aria-atomic="true"></app-toasts>
</div>
