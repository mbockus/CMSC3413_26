# Azure DevOps Pipeline for .NET 10 Application with SPA Client
# This pipeline builds and packages the application for deployment to Azure App Service

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  projectPath: 'Project3/Project3.Server/Project3.Server.csproj'
  
stages:
- stage: Build
  displayName: 'Build and Package'
  jobs:
  - job: BuildJob
    displayName: 'Build .NET Application'
    steps:
    # Install .NET SDK
    - task: UseDotNet@2
      displayName: 'Install .NET SDK $(dotnetVersion)'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'
        includePreviewVersions: true

    # Install Node.js for SPA build
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    # Restore NuGet packages
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '$(projectPath)'

    # Build the application
    - task: DotNetCoreCLI@2
      displayName: 'Build Application'
      inputs:
        command: 'build'
        projects: '$(projectPath)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # Run tests (if any exist)
    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'
      inputs:
        command: 'test'
        projects: '**/*Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
      continueOnError: true

    # Publish the application
    - task: DotNetCoreCLI@2
      displayName: 'Publish Application'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(projectPath)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish --no-build'
        zipAfterPublish: false

    # Create zip file for deployment
    - task: ArchiveFiles@2
      displayName: 'Create Deployment Package'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    # Publish the zip file as a pipeline artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DeployJob
    displayName: 'Deploy using Deployment Credentials'
    steps:
    # Download the artifact
    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    # Deploy using curl with deployment credentials
    - task: Bash@3
      displayName: 'Deploy to App Service via Kudu API'
      env:
        WEBAPP_NAME: $(AZURE_WEBAPP_NAME)
        WEBAPP_USERNAME: $(AZURE_WEBAPP_USERNAME)
        WEBAPP_PASSWORD: $(AZURE_WEBAPP_PASSWORD)
      inputs:
        targetType: 'inline'
        script: |
          # Find the zip file
          ZIP_FILE=$(find $(System.ArtifactsDirectory)/drop -name "*.zip" | head -n 1)
          echo "Deploying: $ZIP_FILE"
          echo "App Service: $WEBAPP_NAME"

          # Deploy using Kudu ZipDeploy API
          curl -X POST \
            -u "$WEBAPP_USERNAME:$WEBAPP_PASSWORD" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ZIP_FILE" \
            "https://$WEBAPP_NAME.scm.azurewebsites.net/api/zipdeploy" \
            -w "\nHTTP Status: %{http_code}\n" \
            --fail-with-body

          # Check deployment status
          if [ $? -eq 0 ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed!"
            exit 1
          fi
